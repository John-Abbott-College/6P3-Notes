[project]
name = "6P3-Notes"
version = "0.1.0"
description = "Website repository for Connected Objects course 420-6P3"
authors = [
  { name = "michaelhaaf", email = "michael.haaf@johnabbott.qc.ca" },
  { name = "maubuz", email = "mauricio.buschinelli@johnabbott.qc.ca" },
]
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "myst-parser>=4.0.1",
    "sphinx>=8.2.3",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-autodoc2>=0.5.0",
    "sphinx-book-theme>=1.1.4",
    "sphinx-comments>=0.0.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "sphinx-favicon>=1.0.1",
    "sphinx-hoverxref>=1.4.2",
    "sphinx-notfound-page>=1.1.0",
    "sphinx-prompt>=1.10.2",
    "sphinx-tags>=0.4",
    "sphinxcontrib-bibtex>=2.6.5",
    "sphinxcontrib-httpdomain>=1.8.1",
    "sphinxcontrib-mermaid>=1.2.3",
    "sphinxemoji>=0.3.1",
    "sphinxext-opengraph>=0.13.0",
]

[tool.uv]
default-groups = "all"

[dependency-groups]
format = [
    "mdformat>=1.0.0",
    "mdformat-myst>=0.3.0",
    "mdformat-pyproject>=0.1.1",
    "mdformat-toc>=0.5.0",
    "pre-commit>=4.5.0",
    "pymarkdownlnt>=0.9.33",
    "ruff>=0.14.8",
]
