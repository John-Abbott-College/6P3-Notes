[project]
name = "6P3-Notes"
version = "0.1.0"
description = "Website repository for Connected Objects course 420-6P3"
authors = [
  { name = "michaelhaaf", email = "michael.haaf@johnabbott.qc.ca" },
  { name = "maubuz", email = "mauricio.buschinelli@johnabbott.qc.ca" },
]
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "mystmd>=1.7.0",
]

[tool.uv]
default-groups = "all"

[dependency-groups]
format = [
    "mdformat>=1.0.0",
    "mdformat-myst>=0.3.0",
    "pymarkdownlnt>=0.9.33",
    "ruff>=0.14.8",
]
